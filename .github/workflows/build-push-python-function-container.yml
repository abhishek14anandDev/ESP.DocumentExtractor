name: Build and push Python Function container

on:
  push:
    branches:
      - main
    paths:
      - ESP.DocumentExtractor.Python/**
      - .github/workflows/build-push-python-function-container.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FUNCTION_PROJECT_PATH: ESP.DocumentExtractor.Python
  ACR_LOGIN_SERVER: espdocumentextractoracr.azurecr.io
  IMAGE_REPOSITORY: dwg-geojson-function

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.FUNCTION_PROJECT_PATH }}/requirements.txt

      - name: Install dependencies for tests
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ env.FUNCTION_PROJECT_PATH }}/requirements.txt"

      - name: Run Python tests
        working-directory: ${{ env.FUNCTION_PROJECT_PATH }}
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        # Required repository secrets:
        # - ACR_USERNAME
        # - ACR_PASSWORD
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FUNCTION_PROJECT_PATH }}
          file: ${{ env.FUNCTION_PROJECT_PATH }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
